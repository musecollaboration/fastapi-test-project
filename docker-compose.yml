services:
  db:
    image: postgres:16
    container_name: fastapi-db
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_pass
      POSTGRES_DB: fastapi_db
    ports:
      - "5432:5432"          # пробрасываем порт PostgreSQL для локального доступа (опционально)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    ports:
      - "6379:6379"          # пробрасываем порт для локального доступа (опционально)
    volumes:
      - redis_data:/data
    restart: always

  fastapi:
    build: .
    container_name: fastapi-container
    ports:
      - "8000:8000"
    volumes:
      - ./:/app                # ← монтируем локальный код
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload   # ← перезагрузка при изменениях
    depends_on:
      - db
      - redis            # добавляем зависимость от Redis
    environment:
      DATABASE_URL: postgresql+asyncpg://fastapi_user:fastapi_pass@db:5432/fastapi_db
      REDIS_URL: redis://redis:6379/0   # переменная для подключения к Redis
      SENTRY_DSN: ${SENTRY_DSN}
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped    

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning   # опционально для автоматической настройки
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:            # новый том для данных Redis
  prometheus_data:
  grafana_data: